<script>
/* One hidden audio element lives in the shared header; the button is the only player UI. */
(function(){
  var toggle=document.getElementById('radio4-toggle');
  var audio=document.getElementById('radio4-audio');
  var label=document.getElementById('radio4-label');
  if(!toggle||!audio||!label)return;
  /* Keep iOS Lock Screen / Control Center metadata independent of the chapter title. */
  function setRadioMetadata(){
    if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'BBC Radio',
      artist: 'BBC Radio',
      album: 'BBC Radio — Live',
      artwork: [
        { src: 'https://lanotfly.github.io/assets/images/bbc-radio-4-now-playing.png?v=20261024-6', sizes: '64x64', type: 'image/png' }
      ]
    });
    try {
      navigator.mediaSession.setActionHandler('play', function(){ audio.play().catch(function(){}); });
      navigator.mediaSession.setActionHandler('pause', function(){ audio.pause(); });
    } catch (_) {}
  }
  function paint(playing){
    toggle.setAttribute('aria-pressed',String(playing));
    toggle.setAttribute('aria-label',playing?'Pause BBC Radio':'Play BBC Radio');
    toggle.classList.toggle('is-playing',playing);
    /* Force the playing BBC button to remain outline-only, matching NHK. */
    if (playing) {
      toggle.style.setProperty('background-color','#f1ebf8','important');
      toggle.style.setProperty('color','#62458a','important');
      toggle.style.setProperty('border-color','#8e76ad','important');
      toggle.style.setProperty('border-style','solid','important');
      toggle.style.setProperty('box-shadow','0 0 0 2px rgba(112,84,147,.08)','important');
    } else {
      toggle.style.removeProperty('background-color');
      toggle.style.removeProperty('color');
      toggle.style.removeProperty('border-color');
      toggle.style.removeProperty('border-style');
      toggle.style.removeProperty('box-shadow');
    }
    label.textContent='BBC Radio';
    if ('mediaSession' in navigator) {
      /* A pause event from BBC must not mark NHK as paused if NHK is now playing. */
      var nhkAudio=document.getElementById('nhk-radio-audio');
      if (playing || !nhkAudio || nhkAudio.paused) {
        try { navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; } catch (_) {}
      }
    }
  }
  /* Do not claim the iPhone Now Playing session until BBC actually starts. */
  toggle.addEventListener('click',function(){
    if(!audio.paused){
      audio.pause();
      paint(false);
      return;
    }
    /* Stop the other station first, before claiming the iOS Now Playing session. */
    var nhkAudio=document.getElementById('nhk-radio-audio');
    if(nhkAudio && !nhkAudio.paused) nhkAudio.pause();
    setRadioMetadata();
    var result=audio.play();
    if(result&&typeof result.then==='function'){
      result.then(function(){
        /* Re-apply BBC metadata after playback starts, overriding the previous station. */
        setRadioMetadata();
        paint(true);
      }).catch(function(){paint(false);});
    }else{
      setRadioMetadata();
      paint(true);
    }
  });
  audio.addEventListener('play',function(){setRadioMetadata();paint(true);});
  audio.addEventListener('pause',function(){paint(false);});
  audio.addEventListener('ended',function(){paint(false);});
  audio.addEventListener('error',function(){paint(false);});
})();
</script>
<script>

/* Play NHK Radio 1 directly from the official live stream; button toggles play/pause. */
(function(){
  var toggle=document.getElementById('nhk-radio-toggle');
  var audio=document.getElementById('nhk-radio-audio');
  if(!toggle||!audio||toggle.dataset.audioBound==='true')return;
  toggle.dataset.audioBound='true';
  function paint(playing){
    toggle.setAttribute('aria-pressed',String(playing));
    toggle.setAttribute('aria-label',playing?'Pause NHK Radio 1':'Play NHK Radio 1');
    toggle.title=playing?'Pause NHK Radio 1':'Play NHK Radio 1';
    toggle.classList.toggle('is-playing',playing);
    var label=toggle.querySelector('.nhk-radio-label');
    if(label) label.textContent='NHK Radio';
    if('mediaSession' in navigator && playing){
      try{
        /* Only the station that is actively playing may claim Now Playing metadata. */
        navigator.mediaSession.playbackState='playing';
        if(typeof MediaMetadata!=='undefined') navigator.mediaSession.metadata=new MediaMetadata({
          title:'NHK Radio 1',
          artist:'NHK らじる★らじる',
          album:'NHK Radio 1 — Live',
          artwork:[
            {src:'https://lanotfly.github.io/assets/images/nhk-radio-square.png?v=20261024-2',sizes:'64x64',type:'image/png'}
          ]
        });
        navigator.mediaSession.setActionHandler('play',function(){audio.play().catch(function(){paint(false);});});
        navigator.mediaSession.setActionHandler('pause',function(){audio.pause();});
      }catch(_){}
    } else if('mediaSession' in navigator){
      /* Do not overwrite the other station's title/artwork when this stream pauses. */
      var bbcAudio=document.getElementById('radio4-audio');
      if(!bbcAudio || bbcAudio.paused){
        try{navigator.mediaSession.playbackState='paused';}catch(_){}
      }
    }
  }
  toggle.addEventListener('click',function(){
    if(!audio.paused){audio.pause();return;}
    /* Stop BBC first, then start NHK from this user gesture. */
    var bbcAudio=document.getElementById('radio4-audio');
    if(bbcAudio && !bbcAudio.paused) bbcAudio.pause();
    var result=audio.play();
    if(result&&typeof result.then==='function'){
      result.then(function(){paint(true);}).catch(function(){paint(false);});
    }else{
      paint(true);
    }
  });
  audio.addEventListener('play',function(){paint(true);});
  audio.addEventListener('pause',function(){paint(false);});
  audio.addEventListener('ended',function(){paint(false);});
  audio.addEventListener('error',function(){paint(false);});
})();

/* Keep audio and iOS Now Playing in sync when switching between stations. */
(function(){
  var bbc=document.getElementById('radio4-audio');
  var nhk=document.getElementById('nhk-radio-audio');
  if(!bbc||!nhk||window.__radioMutualExclusionInstalled)return;
  window.__radioMutualExclusionInstalled=true;

  function syncNowPlaying(){
    if(!('mediaSession' in navigator))return;
    try{
      if(!nhk.paused){
        navigator.mediaSession.metadata=typeof MediaMetadata!=='undefined'?new MediaMetadata({
          title:'NHK Radio 1',
          artist:'NHK らじる★らじる',
          album:'NHK Radio 1 — Live',
          artwork:[{src:'https://lanotfly.github.io/assets/images/nhk-radio-square.png?v=20261024-2',sizes:'64x64',type:'image/png'}]
        }):null;
        navigator.mediaSession.setActionHandler('play',function(){nhk.play().catch(function(){});});
        navigator.mediaSession.setActionHandler('pause',function(){nhk.pause();});
        navigator.mediaSession.playbackState='playing';
      }else if(!bbc.paused){
        navigator.mediaSession.metadata=typeof MediaMetadata!=='undefined'?new MediaMetadata({
          title:'BBC Radio',
          artist:'BBC Radio',
          album:'BBC Radio — Live',
          artwork:[{src:'https://lanotfly.github.io/assets/images/bbc-radio-4-now-playing.png?v=20261024-6',sizes:'64x64',type:'image/png'}]
        }):null;
        navigator.mediaSession.setActionHandler('play',function(){bbc.play().catch(function(){});});
        navigator.mediaSession.setActionHandler('pause',function(){bbc.pause();});
        navigator.mediaSession.playbackState='playing';
      }else{
        navigator.mediaSession.playbackState='paused';
      }
    }catch(_){}
  }
  function syncAfterEvents(){
    /* Let the outgoing station's pause event finish before choosing the active session. */
    setTimeout(syncNowPlaying,0);
  }
  bbc.addEventListener('play',function(){if(!nhk.paused)nhk.pause();syncAfterEvents();});
  nhk.addEventListener('play',function(){if(!bbc.paused)bbc.pause();syncAfterEvents();});
  bbc.addEventListener('pause',syncAfterEvents);
  nhk.addEventListener('pause',syncAfterEvents);
})();


/* Podcast buttons: play the newest episode from each public RSS feed, using one shared audio element. */
(function(){
  var audio=document.getElementById('podcast-audio');
  if(!audio || window.__libraryPodcastsInstalled)return;
  window.__libraryPodcastsInstalled=true;
  var shows={
    'bite-size-toggle':{
      title:'The Bite Size Japanese Podcast',
      artist:'Layla from Bite Size Japanese',
      feed:'https://anchor.fm/s/463a19c0/podcast/rss',
      apple:'https://podcasts.apple.com/jp/podcast/the-bite-size-japanese-podcast/id1588405417?l=en-US',
      artwork:'https://is1-ssl.mzstatic.com/image/thumb/Podcasts116/v4/3c/2c/7f/3c2c7f52-ef6a-4f20-89b9-40d2b7a61c85/mza_16673831214975369420.jpg/600x600bb.jpg'
    },
    'lukes-english-toggle':{
      title:"Luke's English Podcast",
      artist:'Luke Thompson',
      feed:'https://feeds.acast.com/public/shows/62b0ada25c7ea10012f541cb',
      proxyFeed:true,
      apple:'https://podcasts.apple.com/jp/podcast/lukes-english-podcast-learn-british-english-with-luke/id312059190?l=en-US',
      artwork:'https://teacherluke.co.uk/wp-content/uploads/2012/03/LEP-Logo-3000x3000.jpg'
    }
  };
  var activeId=null;
  function paint(id,playing){
    var button=document.getElementById(id);
    if(!button)return;
    button.setAttribute('aria-pressed',String(playing));
    button.classList.toggle('is-playing',playing);
    var show=shows[id];
    button.setAttribute('aria-label',(playing?'Pause ':'Play latest episode: ')+show.title);
    button.title=(playing?'Pause ':'Play latest episode: ')+show.title;
  }
  function setMetadata(show,episode){
    if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined')return;
    try{
      navigator.mediaSession.metadata=new MediaMetadata({
        title:episode||show.title,
        artist:show.artist,
        album:show.title,
        artwork:[{src:show.artwork,sizes:'600x600',type:'image/jpeg'}]
      });
      navigator.mediaSession.setActionHandler('play',function(){audio.play().catch(function(){});});
      navigator.mediaSession.setActionHandler('pause',function(){audio.pause();});
      navigator.mediaSession.playbackState='playing';
    }catch(_){}
  }
  function stopOtherAudio(){
    ['radio4-audio','nhk-radio-audio'].forEach(function(id){
      var other=document.getElementById(id);
      if(other&&!other.paused)other.pause();
    });
    Object.keys(shows).forEach(function(id){if(id!==activeId)paint(id,false);});
  }
  function parseRss(xmlText){
    var xml=new DOMParser().parseFromString(xmlText,'text/xml');
    if(xml.querySelector('parsererror'))throw new Error('Invalid RSS feed');
    var item=xml.querySelector('item');
    if(!item)throw new Error('No episodes in RSS feed');
    var enclosure=item.querySelector('enclosure[url]');
    var episodeTitle=item.querySelector('title');
    if(!enclosure)throw new Error('No playable episode found');
    return {url:enclosure.getAttribute('url'),title:episodeTitle?episodeTitle.textContent.trim():''};
  }
  function latestEpisode(show){
    /* Try the original RSS feed first. Some hosts, including Acast in some browsers,
       do not allow cross-origin RSS reads, so retry through a public RSS-to-JSON service. */
    return fetch(show.feed,{cache:'no-store'}).then(function(response){
      if(!response.ok)throw new Error('RSS feed unavailable');
      return response.text();
    }).then(parseRss).catch(function(directError){
      if(!show.proxyFeed)throw directError;
      var proxyUrl='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(show.feed);
      return fetch(proxyUrl,{cache:'no-store'}).then(function(response){
        if(!response.ok)throw new Error('RSS proxy unavailable');
        return response.json();
      }).then(function(data){
        if(!data||data.status!=='ok'||!Array.isArray(data.items)||!data.items.length)throw new Error('No episodes in RSS proxy response');
        var item=data.items[0];
        var enclosure=item.enclosure;
        var mediaUrl=typeof enclosure==='string'?enclosure:(enclosure&&(enclosure.link||enclosure.url))||item.link;
        if(!mediaUrl)throw new Error('No playable episode in RSS proxy response');
        return {url:mediaUrl,title:item.title||show.title};
      });
    });
  }
  Object.keys(shows).forEach(function(id){
    var button=document.getElementById(id),show=shows[id];
    if(!button)return;
    button.addEventListener('click',function(){
      if(activeId===id&&!audio.paused){audio.pause();return;}
      if(activeId===id&&audio.paused&&audio.src){stopOtherAudio();setMetadata(show,audio.dataset.episodeTitle||show.title);audio.play().catch(function(){window.location.href=show.apple;});return;}
      stopOtherAudio();
      activeId=id;
      button.classList.add('is-loading');
      latestEpisode(show).then(function(episode){
        audio.src=episode.url;
        audio.dataset.episodeTitle=episode.title;
        setMetadata(show,episode.title||show.title);
        return audio.play().then(function(){paint(id,true);setMetadata(show,episode.title||show.title);});
      }).catch(function(){
        /* If the feed blocks browser access or iOS blocks playback, use the official Apple Podcasts page. */
        window.location.href=show.apple;
      }).finally(function(){button.classList.remove('is-loading');});
    });
  });
  audio.addEventListener('play',function(){if(activeId)paint(activeId,true);});
  audio.addEventListener('pause',function(){
    Object.keys(shows).forEach(function(id){paint(id,false);});
    if('mediaSession' in navigator){
      var bbc=document.getElementById('radio4-audio'),nhk=document.getElementById('nhk-radio-audio');
      if((!bbc||bbc.paused)&&(!nhk||nhk.paused)){try{navigator.mediaSession.playbackState='paused';}catch(_){}}
    }
  });
  audio.addEventListener('ended',function(){if(activeId)paint(activeId,false);});
  audio.addEventListener('error',function(){if(activeId)paint(activeId,false);});
})();

/* Keep the shared navigation and its audio element alive between library pages. */
(function(){
  if (window.__librarySoftNavigationInstalled) return;
  window.__librarySoftNavigationInstalled = true;

  function updatePrimaryActive(pathname){
    var links = document.querySelectorAll('.site-tab-links .site-tab');
    links.forEach(function(link){
      var href = link.getAttribute('href') || '';
      var active = false;
      if (href === '/algorithms/') active = pathname === '/algorithms/' || pathname.indexOf('/algorithms/') === 0;
      else if (href === '/data-structures/ai/') active = pathname === '/data-structures/ai/' || pathname.indexOf('/data-structures/ai/') === 0;
      else if (href === '/data-structures/') active = pathname === '/data-structures/' || (pathname.indexOf('/data-structures/') === 0 && pathname.indexOf('/data-structures/ai/') !== 0);
      else if (href === '/kubernetes/') active = pathname === '/kubernetes/' || pathname.indexOf('/kubernetes/') === 0;
      else if (href === '/home/') active = pathname === '/home/' || pathname === '/';
      link.classList.toggle('is-active', active);
      if (active) {
        link.setAttribute('aria-current', 'page');
        /* Inline important styles make the active state survive page-specific CSS. */
        if (!link.classList.contains('site-tab--radio')) {
          var activePalette = link.classList.contains('site-tab--home') ? ['#54267f','#54267f'] :
            link.classList.contains('site-tab--data') ? ['#1b407d','#1b407d'] :
            link.classList.contains('site-tab--algorithm') ? ['#824306','#824306'] :
            link.classList.contains('site-tab--ai') ? ['#115638','#115638'] :
            link.classList.contains('site-tab--kubernetes') ? ['#07575d','#07575d'] : ['#46546a','#344052'];
          link.style.setProperty('color', activePalette[0], 'important');
          link.style.setProperty('background-color', 'transparent', 'important');
          link.style.setProperty('border-color', activePalette[1], 'important');
          link.style.setProperty('border-style', 'solid', 'important');
          link.style.setProperty('border-width', '2px', 'important');
          link.style.setProperty('box-shadow', 'none', 'important');
        }
      } else {
        link.removeAttribute('aria-current');
        link.style.removeProperty('color');
        link.style.removeProperty('background-color');
        link.style.removeProperty('border-color');
        link.style.removeProperty('box-shadow');
      }
    });
  }
  updatePrimaryActive(window.location.pathname);

  /* Remember the last page visited in each learning area for tab-to-tab switching. */
  var lastPageKeys = {
    data: 'library_last_page_data_structure',
    algorithm: 'library_last_page_algorithm',
    ai: 'library_last_page_ai',
    kubernetes: 'library_last_page_kubernetes'
  };
  function sectionForPath(pathname){
    if (pathname === '/algorithms/' || pathname.indexOf('/algorithms/') === 0) return 'algorithm';
    if (pathname === '/data-structures/ai/' || pathname.indexOf('/data-structures/ai/') === 0) return 'ai';
    if (pathname === '/kubernetes/' || pathname.indexOf('/kubernetes/') === 0) return 'kubernetes';
    if (pathname === '/data-structures/' || pathname.indexOf('/data-structures/') === 0) return 'data';
    return null;
  }
  function rememberPage(pathname){
    var section = sectionForPath(pathname);
    if (!section) return;
    try { localStorage.setItem(lastPageKeys[section], pathname); } catch (_) {}
    try { sessionStorage.setItem(lastPageKeys[section], pathname); } catch (_) {}
  }
  function safeRememberedPage(section){
    var path = null;
    try { path = localStorage.getItem(lastPageKeys[section]); } catch (_) {}
    if (!path) {
      try { path = sessionStorage.getItem(lastPageKeys[section]); } catch (_) {}
    }
    return path && sectionForPath(path) === section ? path : null;
  }
  function resolvePrimaryTab(link, currentPath){
    if (!link || !link.classList) return null;
    var targetSection = link.classList.contains('site-tab--data') ? 'data' :
      (link.classList.contains('site-tab--algorithm') ? 'algorithm' :
      (link.classList.contains('site-tab--ai') ? 'ai' :
      (link.classList.contains('site-tab--kubernetes') ? 'kubernetes' : null)));
    if (!targetSection) return null;
    var currentSection = sectionForPath(currentPath);
    if (currentSection === targetSection) return currentPath;
    return safeRememberedPage(targetSection) || link.getAttribute('href');
  }
  rememberPage(window.location.pathname);

  function sameOriginPageLink(link){
    if (!link || !link.href || link.target || link.hasAttribute('download')) return false;
    var url;
    try { url = new URL(link.href, window.location.href); } catch (_) { return false; }
    if (url.origin !== window.location.origin || !/^https?:$/.test(url.protocol)) return false;
    if (link.getAttribute('rel') === 'external') return false;
    return true;
  }

  function runInsertedScripts(root){
    Array.from(root.querySelectorAll('script')).forEach(function(oldScript){
      var script = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function(attr){ script.setAttribute(attr.name, attr.value); });
      script.textContent = oldScript.textContent;
      oldScript.replaceWith(script);
    });
  }

  async function navigate(url, push){
    var response = await fetch(url.href, { credentials: 'same-origin' });
    if (!response.ok) throw new Error('Navigation failed: ' + response.status);
    var doc = new DOMParser().parseFromString(await response.text(), 'text/html');
    var currentInner = document.querySelector('.content-wrapper__inner');
    var nextInner = doc.querySelector('.content-wrapper__inner');
    if (!currentInner || !nextInner) { window.location.href = url.href; return; }

    var currentNav = currentInner.querySelector('.site-nav-shell');
    var nextNav = nextInner.querySelector('.site-nav-shell');
    var rules = Array.from(currentInner.children).filter(function(el){ return el.tagName === 'HR'; });
    var nextRules = Array.from(nextInner.children).filter(function(el){ return el.tagName === 'HR'; });
    if (!currentNav || !nextNav || rules.length < 2 || nextRules.length < 2) {
      window.location.href = url.href;
      return;
    }

    var currentTopRule = rules[0];
    var currentBottomRule = rules[rules.length - 1];
    var nextTopRule = nextRules[0];
    var nextBottomRule = nextRules[nextRules.length - 1];
    var newNodes = [];
    var node = nextTopRule.nextSibling;
    while (node && node !== nextBottomRule) {
      newNodes.push(node.cloneNode(true));
      node = node.nextSibling;
    }

    node = currentTopRule.nextSibling;
    while (node && node !== currentBottomRule) {
      var next = node.nextSibling;
      node.remove();
      node = next;
    }
    newNodes.forEach(function(newNode){ currentInner.insertBefore(newNode, currentBottomRule); });

    document.querySelectorAll('link[data-library-page-style="true"]').forEach(function(link){ link.remove(); });
    doc.querySelectorAll('link[rel="stylesheet"]').forEach(function(link){
      var href = link.href;
      if (href && href.indexOf(window.location.origin + '/data-structures/wiki.css') === 0) {
        var copy = link.cloneNode(true);
        copy.setAttribute('data-library-page-style', 'true');
        document.head.appendChild(copy);
      }
    });

    document.title = doc.title;
    if (push) history.pushState({ libraryPage: true }, '', url.href);
    updatePrimaryActive(url.pathname);
    rememberPage(url.pathname);
    newNodes.forEach(function(insertedNode){
      if (insertedNode.nodeType !== 1) return;
      if (insertedNode.tagName === 'SCRIPT') {
        var freshScript = document.createElement('script');
        Array.from(insertedNode.attributes).forEach(function(attr){ freshScript.setAttribute(attr.name, attr.value); });
        freshScript.textContent = insertedNode.textContent;
        insertedNode.replaceWith(freshScript);
      } else {
        runInsertedScripts(insertedNode);
      }
    });
    if (url.hash) {
      var target = document.getElementById(decodeURIComponent(url.hash.slice(1)));
      if (target) target.scrollIntoView();
    } else {
      window.scrollTo(0, 0);
    }
  }

  document.addEventListener('click', function(event){
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    var link = event.target.closest && event.target.closest('a');
    if (!sameOriginPageLink(link)) return;
    /* Save the page being left before resolving the destination tab. */
    rememberPage(window.location.pathname);
    var primaryPath = resolvePrimaryTab(link, window.location.pathname);
    var url = new URL(primaryPath || link.href, window.location.href);
    if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;
    if (url.pathname === window.location.pathname && url.search === window.location.search && !url.hash) {
      event.preventDefault();
      return;
    }
    event.preventDefault();
    navigate(url, true).catch(function(){ window.location.href = url.href; });
  });

  window.addEventListener('popstate', function(){
    navigate(new URL(window.location.href), false).catch(function(){ window.location.reload(); });
  });
})();
</script>
