<div class="site-nav-shell">
  <nav class="site-tabs" aria-label="Main navigation">
    <div class="site-tab-links">
      <a class="site-tab site-tab--home" href="/home/">Home</a>
      <a class="site-tab site-tab--data" href="/data-structures/">Data Structure</a>
      <a class="site-tab site-tab--algorithm" href="/algorithms/">Algorithm</a>
      <a class="site-tab site-tab--ai" href="/data-structures/ai/">AI Structure</a>
    </div>
    <button class="site-tab site-tab--radio" id="radio4-toggle" type="button" aria-pressed="false">
      <span class="radio-dot" aria-hidden="true"></span><span id="radio4-label">BBC Radio 4 ▶</span>
    </button>
  </nav>
  <section id="radio4-panel" class="radio4-panel" hidden aria-label="BBC Radio 4 player">
    <div class="radio4-panel__heading"><strong>BBC Radio 4 · Live English listening</strong><span id="radio4-status" role="status">Ready to play</span></div>
    <audio id="radio4-audio" controls preload="none" playsinline>
      <source src="https://as-hls-ww-live.akamaized.net/pool_55057080/live/ww/bbc_radio_fourfm/bbc_radio_fourfm.isml/bbc_radio_fourfm-audio%3d96000.norewind.m3u8" type="application/vnd.apple.mpegurl">
    </audio>
    <p class="radio4-note">Tap the red BBC Radio 4 button to play or pause. If your browser cannot play the stream, use the official BBC player below.</p>
    <p class="radio4-fallback"><a href="https://www.bbc.com/audio/play/live/bbc_radio_fourfm" target="_blank" rel="noopener noreferrer">Open BBC Radio 4 on BBC.com ↗</a></p>
  </section>
</div>
<script>
(function(){
  var toggle=document.getElementById('radio4-toggle');
  var panel=document.getElementById('radio4-panel');
  var audio=document.getElementById('radio4-audio');
  var label=document.getElementById('radio4-label');
  var status=document.getElementById('radio4-status');
  if(!toggle||!panel||!audio||!label||!status)return;
  function paint(playing){
    toggle.setAttribute('aria-pressed',String(playing));
    toggle.classList.toggle('is-playing',playing);
    label.textContent=playing?'BBC Radio 4 ❚❚':'BBC Radio 4 ▶';
    status.textContent=playing?'Playing live':'Ready to play';
  }
  toggle.addEventListener('click',function(){
    panel.hidden=false;
    if(!audio.paused){
      audio.pause();
      paint(false);
      return;
    }
    var result=audio.play();
    if(result&&typeof result.catch==='function'){
      result.catch(function(){
        paint(false);
        status.textContent='Stream not supported here — use BBC.com below';
      });
    }
  });
  audio.addEventListener('play',function(){panel.hidden=false;paint(true);});
  audio.addEventListener('pause',function(){paint(false);});
  audio.addEventListener('error',function(){status.textContent='Stream unavailable in this browser — use BBC.com below';paint(false);});
})();
</script>
