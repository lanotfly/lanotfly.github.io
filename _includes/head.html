<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- UX-only session gate; static GitHub Pages cannot enforce real access control. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("library_access_granted") !== "1") {
          var requestedPath = window.location.pathname + window.location.search + window.location.hash;
          if (requestedPath && requestedPath !== "/") {
            sessionStorage.setItem("library_return_to", requestedPath);
            sessionStorage.setItem("library_return_to_at", String(Date.now()));
            window.location.replace("/?return_to=" + encodeURIComponent(requestedPath));
          } else {
            window.location.replace("/");
          }
        }
      } catch (error) {
        var fallbackPath = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(fallbackPath && fallbackPath !== "/" ? "/?return_to=" + encodeURIComponent(fallbackPath) : "/");
      }
    })();
  </script>

	<title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
	<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta name="author" content="Yu Wang">

	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
	<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

	<meta property="og:type" content="article">
	<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
	<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
