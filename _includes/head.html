  <!-- UX-only session gate; static GitHub Pages cannot enforce real access control. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("library_access_granted") !== "1") {
          var requestedPath = window.location.pathname + window.location.search + window.location.hash;
          if (requestedPath && requestedPath !== "/") {
            sessionStorage.setItem("library_return_to", requestedPath);
            sessionStorage.setItem("library_return_to_at", String(Date.now()));
            window.location.replace("/?return_to=" + encodeURIComponent(requestedPath));
          } else {
            window.location.replace("/");
          }
        }
      } catch (error) {
        var fallbackPath = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(fallbackPath && fallbackPath !== "/" ? "/?return_to=" + encodeURIComponent(fallbackPath) : "/");
      }
    })();
  </script>
