name: Refresh podcast News cache

on:
  push:
    paths:
      - ".github/scripts/update_news.py"
      - ".github/workflows/update-news.yml"
      - "assets/js/news-panel.js"
      - "_layouts/default.html"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-podcast-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Refresh latest five episodes from each RSS feed
        run: python3 .github/scripts/update_news.py
      - name: Commit updated static cache
        run: |
          if git diff --quiet -- assets/data/news.json; then
            echo "News cache has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json
          git commit -m "Refresh podcast News cache"
          git pull --rebase origin main
          git push
