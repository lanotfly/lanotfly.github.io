name: Refresh podcast cache

on:
  push:
    paths:
      - ".github/scripts/update_podcast.py"
      - "assets/js/podcast/panel.js"
      - ".github/workflows/update-podcast.yml"
      - "_layouts/default.html"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-podcast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Refresh all available podcast episodes from RSS feeds
        run: python3 .github/scripts/update_podcast.py
      - name: Commit updated static cache
        run: |
          if git diff --quiet -- assets/data/podcast.json; then
            echo "Podcast cache has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/podcast.json
          git commit -m "Refresh podcast episodes"
          git pull --rebase origin main
          git push
