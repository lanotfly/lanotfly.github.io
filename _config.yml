# Basic
title: Data Structures Wiki — Yu Wang
subtitle: Data Structures for Interviews, in Python
welcome_message: <a href="http://lanotfly.github.io/data-structures/">Data Structures Wiki</a>
description: A wiki book of data structures for coding interviews, with Python examples
creator: Yu

url: "https://lanotfly.github.io"

permalink: /:year/:month/:title/

# Format
highlighter: rouge

# supported colors: blue, green, purple, red, orange or slate. If you need clear, leave it empty.
cover_color: slate

# The blog button should not be removed.
blog_button:
    title: Blog
    description: Visit blog

# Navigation buttons in the front page.
nav:
    - {title: Home, description: personal learning hub, url: '/home/'}
    - {title: Data Structure, description: data structures and practical use cases, url: '/data-structures/'}
    - {title: Algorithm, description: common interview algorithms and patterns, url: '/algorithms/'}
    - {title: AI Structure, description: foundations of modern AI, url: '/data-structures/ai/'}

# Pagination
gems: [jekyll-paginate]
paginate: 10
paginate_path: "page/:num/"

