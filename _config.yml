# Basic
title: Personal Knowledge Library — Yu Wang
subtitle: Data and Algorithms for Interviews, in Python
welcome_message: <a href="https://lanotfly.github.io/data/">Data</a>
description: A personal knowledge library for data, algorithms, AI, Linux, and cloud-native systems
creator: Yu

url: "https://lanotfly.github.io"

permalink: /:year/:month/:title/

# Format
highlighter: rouge

# supported colors: blue, green, purple, red, orange or slate. If you need clear, leave it empty.
cover_color: slate

# The blog button should not be removed.
blog_button:
    title: Blog
    description: Visit blog

# Navigation buttons in the front page.
nav:
    - {title: Home, description: personal learning hub, url: '/home/'}
    - {title: Data, description: data and practical use cases, url: '/data/'}
    - {title: Algorithm, description: common interview algorithms and patterns, url: '/algorithms/'}
    - {title: AI Structure, description: foundations of modern AI, url: '/data/ai/'}

# Pagination
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-remote-theme
paginate: 10
paginate_path: "page/:num/"

# Comment
comment:
    disqus: lanotfly

# Social
social:
    weibo: lanotfly
    github: lanotfly
    twitter: lanotfly
    gplus: 101451140448782093699
    Mail: lanotfly@gmail.com

# Google Analytics
ga:
    # id: your_ga_id
    # host: your_host

markdown: kramdown

remote_theme: pages-themes/cayman@v0.2.0
