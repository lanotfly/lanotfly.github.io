<!DOCTYPE html>
<html>

{% include head.html %}

<body>
    <div class="content-wrapper">
        <div class="content-wrapper__inner">
			{% include tabs.html %}
            <section id="library-news-panel" class="library-news-panel" aria-label="BBC Global News and Chronicle News Connect" hidden>
              <div class="library-news-columns">
                <section class="library-news-column" aria-label="BBC Global News Podcast">
                  <button class="library-news-column__heading library-news-column__heading--english" type="button" data-news-toggle="english" aria-expanded="true" aria-controls="library-news-english-body">
                    <span>BBC Global News</span><span class="library-news-column__mark" aria-hidden="true">−</span>
                  </button>
                  <div id="library-news-english-body" data-news-body="english">
                    <p class="library-news-status" data-news-status="english" aria-live="polite">Loading headlines…</p>
                    <ol class="library-news-list" data-news-list="english"></ol>
                  </div>
                </section>
                <section class="library-news-column" aria-label="Chronicle News Connect">
                  <button class="library-news-column__heading library-news-column__heading--japanese" type="button" data-news-toggle="japanese" aria-expanded="true" aria-controls="library-news-japanese-body">
                    <span>Chronicle · News Connect</span><span class="library-news-column__mark" aria-hidden="true">−</span>
                  </button>
                  <div id="library-news-japanese-body" data-news-body="japanese">
                    <p class="library-news-status" data-news-status="japanese" aria-live="polite">ニュースを読み込み中…</p>
                    <ol class="library-news-list" data-news-list="japanese"></ol>
                  </div>
                </section>
              </div>
              <p class="library-news-attribution">Latest five episodes from BBC Global News Podcast and Chronicle News Connect.</p>
            </section>
            <hr class="post-list__divider" />
			{{ content }}
            <hr class="post-list__divider" />
            {% include footer.html %}
		</div>
	</div>

	{% include external.html %}

</body>

</html>
