<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KJV stream test</title>
<body style="font-family:monospace;font-size:13px;margin:12px">
<h3 id="status">TEST RUNNING</h3>
<button id="start" style="font-size:18px;padding:10px 18px;display:none">TAP TO START</button>
<pre id="log" style="white-space:pre-wrap"></pre>
<audio id="a" preload="auto" muted playsinline></audio>
<script>
var logEl = document.getElementById('log');
var statusEl = document.getElementById('status');
var lines = [];
function log(s){ lines.push(s); logEl.textContent = lines.join('\n'); }
var a = document.getElementById('a');
var t0 = Date.now();
function stamp(){ return ((Date.now()-t0)/1000).toFixed(1)+'s'; }
a.addEventListener('loadedmetadata', function(){ log(stamp()+' loadedmetadata duration='+a.duration); });
a.addEventListener('durationchange', function(){ log(stamp()+' durationchange duration='+a.duration); });
a.addEventListener('error', function(){ log(stamp()+' ERROR code='+(a.error&&a.error.code)+' t='+a.currentTime.toFixed(1)); });
a.addEventListener('stalled', function(){ log(stamp()+' stalled t='+a.currentTime.toFixed(1)); });
var phase = 1;
var poller = setInterval(function(){
  log(stamp()+' t='+a.currentTime.toFixed(1)+'/'+a.duration+' rs='+a.readyState+' bufEnd='+(a.buffered.length?a.buffered.end(a.buffered.length-1).toFixed(1):'none'));
}, 3000);
a.addEventListener('ended', function(){
  log(stamp()+' ENDED phase'+phase+' finalT='+a.currentTime.toFixed(2)+' duration='+a.duration);
  if (phase === 1) {
    phase = 2;
    log('phase 2: seeking to duration-20 and playing the tail');
    try { a.currentTime = Math.max(0, a.duration - 20); } catch(e) { log('seek failed: '+e.message); }
    a.playbackRate = 16;
    a.play().catch(function(e){ log('phase2 play rejected: '+e.message); });
    return;
  }
  clearInterval(poller);
  statusEl.textContent = 'TEST DONE';
  log('TEST DONE');
});
function start(){
  document.getElementById('start').style.display = 'none';
  a.src = 'https://biblestudytogether.com/audio-bible/mp3/chapter/kjv/GEN+2.mp3';
  a.play().then(function(){
    a.playbackRate = 16;
    log(stamp()+' playing GEN+2 at 16x');
  }).catch(function(e){
    log('play rejected: '+e.message);
    document.getElementById('start').style.display = 'block';
  });
}
document.getElementById('start').addEventListener('click', start);
start();
setTimeout(function(){
  if (statusEl.textContent !== 'TEST DONE') {
    statusEl.textContent = 'TEST DONE';
    log(stamp()+' TIMEOUT t='+a.currentTime.toFixed(1)+'/'+a.duration);
    log('TEST DONE');
  }
}, 120000);
</script>
</body>
